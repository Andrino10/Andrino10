<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background overlay -->
    <linearGradient
      id="overlay"
      x1="0"
      y1="0"
      x2="1"
      y2="0">

      <stop
        offset="0%"
        stop-color="#000000"
        stop-opacity="0.18"/>

      <stop
        offset="50%"
        stop-color="#000000"
        stop-opacity="0.35"/>

      <stop
        offset="100%"
        stop-color="#000000"
        stop-opacity="0.18"/>

    </linearGradient>


    <!-- Center text aura -->
    <radialGradient id="aura">

      <stop
        offset="0%"
        stop-color="#000000"
        stop-opacity="0.72"/>

      <stop
        offset="45%"
        stop-color="#000000"
        stop-opacity="0.38"/>

      <stop
        offset="100%"
        stop-color="#000000"
        stop-opacity="0"/>

    </radialGradient>


    <!-- Text shadow -->
    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%">

      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="5"
        flood-color="#000000"
        flood-opacity="0.95"/>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND                                        -->
  <!-- ================================================= -->

  <image
    x="0"
    y="0"
    width="1200"
    height="360"
    preserveAspectRatio="xMidYMid slice"
    href="https://raw.githubusercontent.com/Andrino10/Andrino10/main/assets/3030081.jpg"
  />


  <!-- Background overlay -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="360"
    fill="url(#overlay)"
  />


  <!-- ================================================= -->
  <!-- CENTER AURA                                      -->
  <!-- ================================================= -->

  <ellipse
    cx="600"
    cy="175"
    rx="430"
    ry="155"
    fill="url(#aura)">

    <animate
      attributeName="rx"
      values="400;455;400"
      dur="8s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.75;1;0.75"
      dur="8s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ================================================= -->
  <!-- SUBTLE BINARY                                    -->
  <!-- ================================================= -->

  <g
    font-family="monospace"
    font-size="15"
    fill="#ffffff"
    opacity="0.08">

    <text
      x="-350"
      y="55">

      10101010 10101010 10101010 10101010

      <animate
        attributeName="x"
        values="-350;1200;-350"
        dur="20s"
        repeatCount="indefinite"/>

    </text>


    <text
      x="1200"
      y="320">

      01010101 01010101 01010101 01010101

      <animate
        attributeName="x"
        values="1200;-500;1200"
        dur="23s"
        repeatCount="indefinite"/>

    </text>

  </g>


  <!-- ================================================= -->
  <!-- MINIMAL CORNERS                                   -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    opacity="0.45">

    <!-- Top left -->
    <path d="M30 70 V30 H150"/>

    <!-- Top right -->
    <path d="M1050 30 H1170 V70"/>

    <!-- Bottom left -->
    <path d="M30 290 V330 H150"/>

    <!-- Bottom right -->
    <path d="M1050 330 H1170 V290"/>

  </g>


  <!-- ================================================= -->
  <!-- MAIN TITLE                                        -->
  <!-- ================================================= -->

  <text
    x="600"
    y="165"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="8"
    fill="#ffffff"
    stroke="#000000"
    stroke-width="6"
    paint-order="stroke"
    filter="url(#shadow)">

    ANDRINO10

  </text>


  <!-- ================================================= -->
  <!-- ANIMATED LINE                                     -->
  <!-- ================================================= -->

  <line
    x1="385"
    y1="200"
    x2="815"
    y2="200"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.9">

    <animate
      attributeName="x1"
      values="500;385;500"
      dur="6s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x2"
      values="700;815;700"
      dur="6s"
      repeatCount="indefinite"/>

  </line>


  <!-- ================================================= -->
  <!-- SUBTITLE                                          -->
  <!-- ================================================= -->

  <text
    x="600"
    y="235"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="3"
    fill="#ffffff"
    filter="url(#shadow)">

    INFORMATICS ENGINEERING • DEVELOPER • AI ENTHUSIAST

  </text>


  <!-- ================================================= -->
  <!-- DESCRIPTION                                       -->
  <!-- ================================================= -->

  <text
    x="600"
    y="258"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="2"
    fill="#ffffff"
    opacity="0.82">

    BUILDING IDEAS INTO DIGITAL SOLUTIONS

  </text>


  <!-- ================================================= -->
  <!-- BOTTOM NAVIGATION                                 -->
  <!-- ================================================= -->

  <g
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="600"
    letter-spacing="2"
    fill="#ffffff"
    text-anchor="middle">

    <text x="390" y="300">
      BUILD
    </text>

    <text x="510" y="300">
      EXPLORE
    </text>

    <text x="690" y="300">
      CREATE
    </text>

    <text x="810" y="300">
      IMPROVE
    </text>

  </g>


  <!-- ================================================= -->
  <!-- SEPARATORS                                        -->
  <!-- ================================================= -->

  <g
    stroke="#ffffff"
    stroke-width="1"
    opacity="0.55">

    <line
      x1="450"
      y1="288"
      x2="450"
      y2="307"/>

    <line
      x1="600"
      y1="288"
      x2="600"
      y2="307"/>

    <line
      x1="750"
      y1="288"
      x2="750"
      y2="307"/>

  </g>


  <!-- ================================================= -->
  <!-- MOTTO                                             -->
  <!-- ================================================= -->

  <text
    x="600"
    y="332"
    text-anchor="middle"
    font-family="monospace"
    font-size="10"
    letter-spacing="5"
    fill="#ffffff"
    opacity="0.75">

    LEARN • BUILD • IMPROVE • REPEAT

    <animate
      attributeName="opacity"
      values="0.4;0.85;0.4"
      dur="4s"
      repeatCount="indefinite"/>

  </text>


</svg>
