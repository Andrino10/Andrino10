<svg width="1200" height="320" viewBox="0 0 1200 320"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="background"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="50%" stop-color="#f7f7f7"/>
    <stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>

  <!-- Aura -->
  <radialGradient id="aura">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.10"/>
    <stop offset="35%" stop-color="#000000" stop-opacity="0.045"/>
    <stop offset="70%" stop-color="#000000" stop-opacity="0.015"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- Soft Glow -->
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

  <!-- Small Blur -->
  <filter id="blur">
    <feGaussianBlur stdDeviation="3"/>
  </filter>

</defs>


<!-- BACKGROUND -->

<rect width="1200"
      height="320"
      fill="url(#background)"/>


<!-- DIGITAL BINARY BACKGROUND -->

<g
  font-family="monospace"
  font-size="22"
  font-weight="700"
  fill="#000000"
  opacity="0.035">

  <text x="-300" y="70">
    10101010 10101010 10101010 10101010 10101010

    <animate
      attributeName="x"
      values="-300;0;-300"
      dur="14s"
      repeatCount="indefinite"/>
  </text>

  <text x="0" y="115">
    10101010 10101010 10101010 10101010 10101010

    <animate
      attributeName="x"
      values="0;-300;0"
      dur="18s"
      repeatCount="indefinite"/>
  </text>

  <text x="-500" y="165">
    10101010 10101010 10101010 10101010 10101010

    <animate
      attributeName="x"
      values="-500;100;-500"
      dur="20s"
      repeatCount="indefinite"/>
  </text>

  <text x="100" y="215">
    10101010 10101010 10101010 10101010 10101010

    <animate
      attributeName="x"
      values="100;-400;100"
      dur="16s"
      repeatCount="indefinite"/>
  </text>

  <text x="-200" y="270">
    10101010 10101010 10101010 10101010 10101010

    <animate
      attributeName="x"
      values="-200;300;-200"
      dur="22s"
      repeatCount="indefinite"/>
  </text>

</g>


<!-- DIGITAL GRID -->

<g
  stroke="#000000"
  stroke-width="1"
  opacity="0.035">

  <line x1="0" y1="40" x2="1200" y2="40"/>
  <line x1="0" y1="80" x2="1200" y2="80"/>
  <line x1="0" y1="120" x2="1200" y2="120"/>
  <line x1="0" y1="160" x2="1200" y2="160"/>
  <line x1="0" y1="200" x2="1200" y2="200"/>
  <line x1="0" y1="240" x2="1200" y2="240"/>
  <line x1="0" y1="280" x2="1200" y2="280"/>

  <line x1="100" y1="0" x2="100" y2="320"/>
  <line x1="200" y1="0" x2="200" y2="320"/>
  <line x1="300" y1="0" x2="300" y2="320"/>
  <line x1="400" y1="0" x2="400" y2="320"/>
  <line x1="500" y1="0" x2="500" y2="320"/>
  <line x1="600" y1="0" x2="600" y2="320"/>
  <line x1="700" y1="0" x2="700" y2="320"/>
  <line x1="800" y1="0" x2="800" y2="320"/>
  <line x1="900" y1="0" x2="900" y2="320"/>
  <line x1="1000" y1="0" x2="1000" y2="320"/>
  <line x1="1100" y1="0" x2="1100" y2="320"/>

</g>


<!-- MAIN AURA -->

<ellipse
  cx="600"
  cy="150"
  rx="330"
  ry="150"
  fill="url(#aura)">

  <animate
    attributeName="rx"
    values="300;350;300"
    dur="6s"
    repeatCount="indefinite"/>

  <animate
    attributeName="ry"
    values="135;165;135"
    dur="6s"
    repeatCount="indefinite"/>

</ellipse>


<!-- OUTER ENERGY RINGS -->

<ellipse
  cx="600"
  cy="150"
  rx="310"
  ry="105"
  fill="none"
  stroke="#000000"
  stroke-width="1"
  opacity="0.08">

  <animate
    attributeName="rx"
    values="280;330;280"
    dur="5s"
    repeatCount="indefinite"/>

  <animate
    attributeName="opacity"
    values="0.03;0.10;0.03"
    dur="5s"
    repeatCount="indefinite"/>

</ellipse>


<ellipse
  cx="600"
  cy="150"
  rx="350"
  ry="130"
  fill="none"
  stroke="#000000"
  stroke-width="1"
  opacity="0.035">

  <animate
    attributeName="rx"
    values="330;380;330"
    dur="7s"
    repeatCount="indefinite"/>

  <animate
    attributeName="ry"
    values="120;145;120"
    dur="7s"
    repeatCount="indefinite"/>

</ellipse>


<!-- MOVING LIGHT PARTICLES -->

<circle cx="300" cy="80" r="2" fill="#000000" opacity="0.25">
  <animate
    attributeName="cx"
    values="300;900;300"
    dur="9s"
    repeatCount="indefinite"/>
</circle>

<circle cx="900" cy="230" r="2" fill="#000000" opacity="0.18">
  <animate
    attributeName="cx"
    values="900;300;900"
    dur="11s"
    repeatCount="indefinite"/>
</circle>

<circle cx="430" cy="260" r="1.5" fill="#000000" opacity="0.2">
  <animate
    attributeName="cy"
    values="260;70;260"
    dur="8s"
    repeatCount="indefinite"/>
</circle>

<circle cx="760" cy="60" r="1.5" fill="#000000" opacity="0.2">
  <animate
    attributeName="cy"
    values="60;250;60"
    dur="10s"
    repeatCount="indefinite"/>
</circle>


<!-- MAIN NAME -->

<text
  x="600"
  y="145"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="66"
  font-weight="900"
  letter-spacing="2"
  fill="#000000">

  ANDRINO10

</text>


<!-- SUBTITLE -->

<text
  x="600"
  y="185"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="19"
  font-weight="500"
  letter-spacing="1"
  fill="#222222">

  INFORMATICS ENGINEERING • DEVELOPER • AI ENTHUSIAST

</text>


<!-- SMALL DIGITAL TEXT -->

<text
  x="600"
  y="225"
  text-anchor="middle"
  font-family="monospace"
  font-size="11"
  letter-spacing="5"
  fill="#000000"
  opacity="0.35">

  10101010 • 10101010 • 10101010

  <animate
    attributeName="opacity"
    values="0.15;0.4;0.15"
    dur="4s"
    repeatCount="indefinite"/>

</text>

</svg>
