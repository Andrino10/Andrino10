<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>

    <!-- Background overlay -->
    <linearGradient id="overlay"
      x1="0%" y1="0%"
      x2="100%" y2="0%">

      <stop offset="0%"
        stop-color="#000000"
        stop-opacity="0.18"/>

      <stop offset="50%"
        stop-color="#000000"
        stop-opacity="0.42"/>

      <stop offset="100%"
        stop-color="#000000"
        stop-opacity="0.18"/>

    </linearGradient>


    <!-- Center dark aura -->
    <radialGradient id="centerGlow">

      <stop offset="0%"
        stop-color="#000000"
        stop-opacity="0.72"/>

      <stop offset="45%"
        stop-color="#000000"
        stop-opacity="0.38"/>

      <stop offset="100%"
        stop-color="#000000"
        stop-opacity="0"/>

    </radialGradient>


    <!-- Text shadow -->
    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%">

      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="5"
        flood-color="#000000"
        flood-opacity="0.95"/>

    </filter>

  </defs>


  <!-- ================================================ -->
  <!-- BACKGROUND                                       -->
  <!-- ================================================ -->

  <image
    x="0"
    y="0"
    width="1200"
    height="360"
    preserveAspectRatio="xMidYMid slice"
    xlink:href="./3030081.jpg"
  />


  <!-- Overall overlay -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="360"
    fill="url(#overlay)"
  />


  <!-- ================================================ -->
  <!-- CENTER AURA                                      -->
  <!-- ================================================ -->

  <ellipse
    cx="600"
    cy="175"
    rx="430"
    ry="155"
    fill="url(#centerGlow)">

    <animate
      attributeName="rx"
      values="400;455;400"
      dur="8s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.75;1;0.75"
      dur="8s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ================================================ -->
  <!-- SUBTLE BINARY                                    -->
  <!-- ================================================ -->

  <g
    font-family="monospace"
    font-size="14"
    fill="#ffffff"
    opacity="0.07">

    <text x="-300" y="55">
      10101010 10101010 10101010 10101010

      <animate
        attributeName="x"
        values="-300;1200;-300"
        dur="20s"
        repeatCount="indefinite"/>
    </text>


    <text x="1200" y="320">
      01010101 01010101 01010101 01010101

      <animate
        attributeName="x"
        values="1200;-500;1200"
        dur="23s"
        repeatCount="indefinite"/>
    </text>

  </g>


  <!-- ================================================ -->
  <!-- MINIMAL CORNER ELEMENTS                          -->
  <!-- ================================================ -->

  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    opacity="0.45">

    <!-- Top left -->

    <path d="M30 70 V30 H150"/>

    <!-- Top right -->

    <path d="M1050 30 H1170 V70"/>

    <!-- Bottom left -->

    <path d="M30 290 V330 H150"/>

    <!-- Bottom right -->

    <path d="M1050 330 H1170 V290"/>

  </g>


  <!-- ================================================ -->
  <!-- MAIN TITLE                                       -->
  <!-- ================================================ -->

  <text
    x="600"
    y="165"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="76"
    font-weight="900"
    letter-spacing="7"
    fill="#ffffff"
    stroke="#000000"
    stroke-width="6"
    paint-order="stroke"
    filter="url(#shadow)">

    ANDRINO10

  </text>


  <!-- ================================================ -->
  <!-- UNDERLINE                                        -->
  <!-- ================================================ -->

  <path
    d="M385 188 Q600 205 815 188"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.9">

    <animate
      attributeName="stroke-dasharray"
      values="0 500;500 0;0 500"
      dur="6s"
      repeatCount="indefinite"/>

  </path>


  <!-- ================================================ -->
  <!-- SUBTITLE                                         -->
  <!-- ================================================ -->

  <text
    x="600"
    y="230"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="3"
    fill="#ffffff"
    filter="url(#shadow)">

    INFORMATICS ENGINEERING • DEVELOPER • AI ENTHUSIAST

  </text>


  <!-- ================================================ -->
  <!-- SMALL DESCRIPTION                                -->
  <!-- ================================================ -->

  <text
    x="600"
    y="255"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="2"
    fill="#ffffff"
    opacity="0.8">

    BUILDING IDEAS INTO DIGITAL SOLUTIONS

  </text>


  <!-- ================================================ -->
  <!-- BOTTOM TAGS                                      -->
  <!-- ================================================ -->

  <g
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="600"
    letter-spacing="2"
    fill="#ffffff"
    text-anchor="middle">

    <text x="390" y="300">
      BUILD
    </text>

    <text x="510" y="300">
      EXPLORE
    </text>

    <text x="690" y="300">
      CREATE
    </text>

    <text x="810" y="300">
      IMPROVE
    </text>

  </g>


  <!-- Separators -->

  <g
    stroke="#ffffff"
    stroke-width="1"
    opacity="0.5">

    <line x1="450" y1="288" x2="450" y2="305"/>
    <line x1="600" y1="288" x2="600" y2="305"/>
    <line x1="750" y1="288" x2="750" y2="305"/>

  </g>


  <!-- ================================================ -->
  <!-- MOTTO                                            -->
  <!-- ================================================ -->

  <text
    x="600"
    y="330"
    text-anchor="middle"
    font-family="monospace"
    font-size="10"
    letter-spacing="5"
    fill="#ffffff"
    opacity="0.75">

    LEARN • BUILD • IMPROVE • REPEAT

    <animate
      attributeName="opacity"
      values="0.4;0.85;0.4"
      dur="4s"
      repeatCount="indefinite"/>

  </text>


</svg>
